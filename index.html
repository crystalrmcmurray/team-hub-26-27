<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Team Hub 26-27</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --purple: #7c3aed; --purple-dark: #6d28d9; --purple-light: #ede9fe;
    --bg: #f6f5fa; --panel: #ffffff; --border: #e5e4ec; --text: #1a1a24; --muted: #6b6b7b;
    --gold: #d4a017; --silver: #8e9aa6; --bronze: #b5793a;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { font-family: Inter, system-ui, sans-serif; background: var(--bg); color: var(--text); display: flex; min-height: 100vh; }

  /* Sidebar */
  nav { width: 240px; background: var(--purple); color: #fff; padding: 20px 14px; display: flex; flex-direction: column; gap: 4px; flex-shrink: 0; }
  nav .brand { font-size: 19px; font-weight: 800; padding: 6px 10px 18px; letter-spacing: -0.01em; }
  nav button { background: none; border: 0; color: #e9ddff; text-align: left; padding: 10px 12px; border-radius: 8px; font: inherit; font-size: 15px; cursor: pointer; }
  nav button:hover { background: rgba(255,255,255,.12); }
  nav button.active { background: rgba(255,255,255,.22); color: #fff; font-weight: 600; }
  nav .updated { margin-top: auto; font-size: 12px; color: #d5c6ff; padding: 10px 12px; }

  /* Main */
  main { flex: 1; min-width: 0; padding: 28px 32px 60px; }
  h1 { margin: 0 0 18px; font-size: 30px; font-weight: 800; letter-spacing: -0.02em; }
  h2 { margin: 0; font-size: 17px; font-weight: 600; }
  .sub { color: var(--muted); font-size: 14px; margin: -10px 0 18px; }

  .tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--border); margin-bottom: 20px; overflow-x: auto; }
  .tabs button { background: none; border: 0; border-bottom: 2px solid transparent; padding: 10px 14px; font: inherit; font-size: 15px; color: var(--muted); cursor: pointer; white-space: nowrap; }
  .tabs button.active { color: var(--text); border-bottom-color: var(--text); font-weight: 600; }

  .controls { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 14px; }
  input, select { background: var(--panel); color: var(--text); border: 1px solid var(--border); border-radius: 8px; padding: 9px 12px; font: inherit; font-size: 14px; }
  input[type=search] { min-width: 220px; flex: 1; }

  .panel { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; }
  .scroll { overflow: auto; }
  table { border-collapse: collapse; width: 100%; font-size: 14px; }
  th, td { padding: 11px 14px; text-align: left; border-bottom: 1px solid var(--border); white-space: nowrap; }
  th { position: sticky; top: 0; background: #fafafc; color: var(--muted); font-weight: 600; cursor: pointer; user-select: none; }
  th.sorted { color: var(--text); }
  td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
  tr.group td { background: var(--purple-light); font-weight: 700; color: var(--purple-dark); }
  .place { font-size: 11px; color: var(--muted); margin-left: 4px; }
  .place.p1 { color: var(--gold); font-weight: 700; } .place.p2 { color: var(--silver); font-weight: 700; } .place.p3 { color: var(--bronze); font-weight: 700; }
  .count, .empty { color: var(--muted); font-size: 13px; padding: 12px 14px; }
  .empty { text-align: center; padding: 48px 14px; font-size: 15px; }

  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(340px, 1fr)); gap: 18px; }
  .card { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; }
  .card header { display: flex; justify-content: space-between; align-items: center; padding: 16px 18px; border-bottom: 1px solid var(--border); }
  .card .scroll { max-height: 420px; }
  .rank { color: var(--muted); font-size: 12px; width: 28px; }

  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 18px; }
  .stat { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 22px 24px; }
  .stat .label { color: var(--muted); font-size: 13px; font-weight: 500; margin-bottom: 8px; }
  .stat .value { font-size: 34px; font-weight: 800; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }
  .stat.balance .value { color: var(--purple-dark); }

  /* Calendar */
  .cal-head { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; flex-wrap: wrap; }
  .cal-head h2 { font-size: 22px; font-weight: 800; margin-right: auto; }
  .btn { background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 7px 12px; font: inherit; font-size: 14px; cursor: pointer; }
  .btn:hover { background: #f2f1f7; }
  .cal { display: grid; grid-template-columns: repeat(7, 1fr); background: var(--border); gap: 1px; border: 1px solid var(--border); border-radius: 12px; overflow: hidden; }
  .cal .dow { background: #fafafc; color: var(--muted); font-size: 12px; font-weight: 600; padding: 8px; text-align: center; }
  .cal .day { background: var(--panel); min-height: 96px; padding: 6px; font-size: 13px; }
  .cal .day.other { background: #fafafc; color: #b5b5c2; }
  .cal .day.today .dnum { background: var(--purple); color: #fff; border-radius: 12px; padding: 1px 7px; }
  .cal .dnum { display: inline-block; margin-bottom: 4px; color: var(--muted); }
  .ev { background: var(--purple-light); color: var(--purple-dark); border-radius: 6px; padding: 3px 7px; font-size: 12px; margin-bottom: 3px; cursor: pointer; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .ev:hover { background: #ddd3fb; }
  .upcoming { margin-top: 24px; }
  .upcoming .row { display: flex; gap: 16px; padding: 12px 16px; border-bottom: 1px solid var(--border); cursor: pointer; align-items: baseline; }
  .upcoming .row:hover { background: #fafafc; }
  .upcoming .date { color: var(--purple-dark); font-weight: 600; min-width: 110px; }
  .upcoming .ath { color: var(--muted); font-size: 13px; margin-left: auto; text-align: right; }

  /* Modal */
  .overlay { position: fixed; inset: 0; background: rgba(20,16,40,.45); display: none; align-items: center; justify-content: center; padding: 20px; z-index: 10; }
  .overlay.open { display: flex; }
  .modal { background: var(--panel); border-radius: 14px; width: min(520px, 100%); padding: 22px 24px; box-shadow: 0 20px 60px rgba(0,0,0,.25); }
  .modal h3 { margin: 0 0 14px; font-size: 20px; }
  .modal .kv { display: grid; grid-template-columns: 110px 1fr; gap: 10px 14px; font-size: 14px; }
  .modal .k { color: var(--muted); }
  .chips span { display: inline-block; background: var(--purple-light); color: var(--purple-dark); border-radius: 6px; padding: 3px 8px; margin: 0 6px 6px 0; font-size: 13px; }
  .modal .close { float: right; }

  .error { background: #fff1f1; color: #b42318; border: 1px solid #f5c2c2; border-radius: 10px; padding: 14px 16px; }

  @media (max-width: 760px) {
    body { flex-direction: column; }
    nav { width: auto; flex-direction: row; flex-wrap: wrap; padding: 12px; gap: 4px; }
    nav .brand { width: 100%; padding: 4px 8px 10px; font-size: 17px; }
    nav button { font-size: 13px; padding: 7px 10px; }
    nav .updated { display: none; }
    main { padding: 18px 14px 40px; }
    h1 { font-size: 24px; }
    .cal .day { min-height: 64px; padding: 4px; }
    .ev { font-size: 10px; padding: 2px 4px; }
  }
</style>
</head>
<body>
<nav id="nav"><div class="brand" id="brand">Team Hub</div></nav>
<main id="main"><div class="empty">Loading...</div></main>

<div class="overlay" id="overlay"><div class="modal" id="modal"></div></div>

<script>
// ============================================================
// CONFIG: edit this block
// ============================================================
const CONFIG = {
  title: 'Team Hub 26-27',

  // Published CSV URL for each tab of the Google Sheet. The comment says which tab goes where.
  sources: {
    athletes: 'https://docs.google.com/spreadsheets/d/e/2PACX-1vRCfjab-j_AbSVXVgjsZUNDUHmpnGy5cSUcbdgMzrnq-1Ayoyt2tU8DOf0T8tBi5AXDbv8xrdgvAl8Q/pub?gid=1091421500&single=true&output=csv', // tab: Full Roster
    scores:   'https://docs.google.com/spreadsheets/d/e/2PACX-1vRCfjab-j_AbSVXVgjsZUNDUHmpnGy5cSUcbdgMzrnq-1Ayoyt2tU8DOf0T8tBi5AXDbv8xrdgvAl8Q/pub?gid=873001730&single=true&output=csv',  // tab: Scores
    meets:    'https://docs.google.com/spreadsheets/d/e/2PACX-1vRCfjab-j_AbSVXVgjsZUNDUHmpnGy5cSUcbdgMzrnq-1Ayoyt2tU8DOf0T8tBi5AXDbv8xrdgvAl8Q/pub?gid=405107316&single=true&output=csv',  // tab: Calendar
    chalk:    'https://docs.google.com/spreadsheets/d/e/2PACX-1vRCfjab-j_AbSVXVgjsZUNDUHmpnGy5cSUcbdgMzrnq-1Ayoyt2tU8DOf0T8tBi5AXDbv8xrdgvAl8Q/pub?gid=1279714751&single=true&output=csv', // tab: Chalk Fund Balance
    meta:     'https://docs.google.com/spreadsheets/d/e/2PACX-1vRCfjab-j_AbSVXVgjsZUNDUHmpnGy5cSUcbdgMzrnq-1Ayoyt2tU8DOf0T8tBi5AXDbv8xrdgvAl8Q/pub?gid=675482059&single=true&output=csv',  // tab: Meta
  },

  // Column names as they appear in each table. Change here if yours differ.
  fields: {
    athletes: {
      last: 'Last Name', first: 'First Name', preferred: 'Preferred Name', level: 'Level',
      shirt: 'T Shirt Size', color: 'Favorite Color',
      // Matches the interface: only Full Roster rows where Group # is 3. Blank filterField shows everyone.
      filterField: 'Group #', filterValue: '3',
    },
    scores: {
      name: 'Name', date: 'Date', meet: 'Meet', session: 'Session', level: 'Level', division: 'Division',
      events: { Vault: 'Vault', Bars: 'Bars', Beam: 'Beam', Floor: 'Floor', AA: 'AA' },
      places: { Vault: 'Vault Place', Bars: 'Bars Place', Beam: 'Beam Place', Floor: 'Floor Place', AA: 'AA Place' },
    },
    meets: { name: 'Meet', date: 'Dates', time: 'Time', athletes: 'Athletes' },
    chalk: { deposit: 'Deposit Total', spent: 'Amount Spent', balance: 'Calculation' },
  },

  // Roster columns, in order.
  rosterColumns: ['Last Name', 'First Name', 'Preferred Name', 'Level', 'Parents', 'Phone', 'E-mail', 'T Shirt Size', 'Favorite Color', 'Allergies'],

  // Optional shared access code. If set, visitors type it once and the browser remembers it.
  // No account or sign-in involved. Leave as '' for a fully open page.
  accessCode: '',

  // Month a season starts (8 = August). A meet on 2026-12-06 falls in season "2026-2027".
  seasonStartMonth: 8,
};
// ============================================================

const SECTIONS = [
  ['roster', 'Team Roster'], ['calendar', 'Meet Calendar'], ['season', "This Season's Scores"],
  ['best', 'Best Scores'], ['average', 'Average Scores'], ['chalk', 'Chalk Fund Balance'],
];
const state = { section: 'roster', data: {}, seasonTab: null, calMonth: null, sort: {}, filters: {} };

/* ---------- Data loading ---------- */
async function loadCsv(url) {
  const res = await fetch(url, { cache: 'no-store' });
  if (!res.ok) throw new Error('Could not load data (' + res.status + ')');
  return parseCsv(await res.text());
}
function parseCsv(text) {
  const rows = []; let row = [], cell = '', q = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i], n = text[i + 1];
    if (q) { if (c === '"' && n === '"') { cell += '"'; i++; } else if (c === '"') q = false; else cell += c; }
    else if (c === '"') q = true;
    else if (c === ',') { row.push(cell); cell = ''; }
    else if (c === '\n' || c === '\r') { if (c === '\r' && n === '\n') i++; row.push(cell); rows.push(row); row = []; cell = ''; }
    else cell += c;
  }
  if (cell.length || row.length) { row.push(cell); rows.push(row); }
  const header = (rows.shift() || []).map(h => h.trim());
  return rows.filter(r => r.some(v => v !== '')).map(r => { const o = {}; header.forEach((h, i) => o[h] = (r[i] ?? '').trim()); return o; });
}

function gateOk() {
  if (!CONFIG.accessCode) return true;
  try { if (localStorage.getItem('teamhub_code') === CONFIG.accessCode) return true; } catch {}
  return false;
}
function renderGate() {
  const main = document.getElementById('main');
  main.innerHTML = '<div class="panel" style="max-width:420px;margin:60px auto;padding:28px"><h2 style="margin-bottom:6px">Enter team access code</h2>' +
    '<div class="sub" style="margin:0 0 16px">Ask a coach or team parent if you need it.</div>' +
    '<form id="gate" style="display:flex;gap:8px"><input id="code" type="password" placeholder="Access code" style="flex:1" autofocus><button class="btn" style="background:var(--purple);color:#fff;border-color:var(--purple)">Open</button></form>' +
    '<div id="gateErr" style="color:#b42318;font-size:13px;margin-top:10px"></div></div>';
  document.getElementById('gate').onsubmit = e => {
    e.preventDefault();
    if (document.getElementById('code').value.trim() === CONFIG.accessCode) {
      try { localStorage.setItem('teamhub_code', CONFIG.accessCode); } catch {}
      init();
    } else document.getElementById('gateErr').textContent = 'That code did not match.';
  };
}

async function init() {
  document.getElementById('brand').textContent = CONFIG.title;
  document.title = CONFIG.title;
  if (!gateOk()) return renderGate();
  try {
    const keys = Object.keys(CONFIG.sources);
    const results = await Promise.allSettled(keys.map(k => loadCsv(CONFIG.sources[k])));
    results.forEach((r, i) => { state.data[keys[i]] = r.status === 'fulfilled' ? r.value : []; });
    const failed = keys.filter((k, i) => results[i].status === 'rejected' && k !== 'meta');
    if (failed.length === keys.length - 1) throw new Error('No data loaded. Check the CSV URLs in CONFIG.');
    prepare();
    renderNav();
    render();
    if (failed.length) console.warn('Failed to load:', failed.join(', '));
  } catch (e) {
    document.getElementById('main').innerHTML = '<div class="error">' + esc(e.message) + '</div>';
  }
}

/* ---------- Data prep ---------- */
function parseDate(s) {
  if (!s) return null;
  const m = String(s).match(/^(\d{4})-(\d{2})-(\d{2})/);
  if (m) return new Date(+m[1], +m[2] - 1, +m[3]);
  const d = new Date(s); return isNaN(d) ? null : new Date(d.getFullYear(), d.getMonth(), d.getDate());
}
function seasonOf(d) {
  if (!d) return 'Unknown';
  const y = d.getMonth() + 1 >= CONFIG.seasonStartMonth ? d.getFullYear() : d.getFullYear() - 1;
  return y + '-' + (y + 1);
}
function num(v) { const n = parseFloat(String(v).replace(/[$,]/g, '')); return isNaN(n) ? null : n; }
function money(v) { const n = num(v); return n === null ? String(v || '') : n.toLocaleString('en-US', { style: 'currency', currency: 'USD' }); }

function prepare() {
  const f = CONFIG.fields.scores;
  state.scores = (state.data.scores || []).map(r => {
    const d = parseDate(r[f.date]);
    const o = { raw: r, name: r[f.name], date: d, season: seasonOf(d), meet: r[f.meet], session: r[f.session], level: r[f.level], division: r[f.division], ev: {}, pl: {} };
    Object.keys(f.events).forEach(e => { o.ev[e] = num(r[f.events[e]]); o.pl[e] = r[f.places[e]] || ''; });
    return o;
  }).filter(s => s.name);
  state.meets = (state.data.meets || []).map(r => ({ raw: r, name: r[CONFIG.fields.meets.name], date: parseDate(r[CONFIG.fields.meets.date]), time: r[CONFIG.fields.meets.time], athletes: r[CONFIG.fields.meets.athletes] })).filter(m => m.name);

  const seasons = new Set(state.scores.map(s => s.season).filter(s => s !== 'Unknown'));
  state.currentSeason = seasonOf(new Date());
  seasons.add(state.currentSeason);
  state.seasons = [...seasons].sort().reverse();
  state.seasonTab = state.currentSeason;
  const now = new Date(); state.calMonth = new Date(now.getFullYear(), now.getMonth(), 1);

  const lu = (state.data.meta || []).find(r => r.key === 'last_updated');
  state.updated = lu ? new Date(lu.value) : null;
}

/* ---------- Nav ---------- */
function renderNav() {
  const nav = document.getElementById('nav');
  nav.innerHTML = '<div class="brand">' + esc(CONFIG.title) + '</div>';
  SECTIONS.forEach(([id, label]) => {
    const b = document.createElement('button'); b.textContent = label; b.className = id === state.section ? 'active' : '';
    b.onclick = () => { state.section = id; location.hash = id; renderNav(); render(); };
    nav.appendChild(b);
  });
  const u = document.createElement('div'); u.className = 'updated';
  u.textContent = state.updated ? 'Data updated ' + state.updated.toLocaleString([], { dateStyle: 'medium', timeStyle: 'short' }) : '';
  nav.appendChild(u);
}

function render() {
  const main = document.getElementById('main');
  main.innerHTML = '';
  ({ roster: renderRoster, calendar: renderCalendar, season: renderSeason, best: () => renderAgg('best'), average: () => renderAgg('average'), chalk: renderChalk })[state.section](main);
}

/* ---------- Roster ---------- */
function renderRoster(main) {
  const f = CONFIG.fields.athletes;
  let rows = state.data.athletes || [];
  if (f.filterField) rows = rows.filter(r => String(r[f.filterField]).toLowerCase() === String(f.filterValue).toLowerCase());
  const cols = CONFIG.rosterColumns.filter(c => rows.length && c in rows[0]);
  const levels = [...new Set(rows.map(r => r[f.level]).filter(Boolean))].sort((a, b) => num(a) - num(b));

  main.innerHTML = '<h1>Team Roster</h1><div class="sub">' + rows.length + ' athletes</div>' +
    '<div class="controls"><input type="search" id="q" placeholder="Search athletes..."><select id="lvl"><option value="">All levels</option>' +
    levels.map(l => '<option' + (state.filters.level === l ? ' selected' : '') + '>Level ' + esc(l) + '</option>').join('') + '</select></div>' +
    '<div class="panel"><div class="scroll"><table id="t"></table></div><div class="count" id="count"></div></div>';

  const draw = () => {
    const q = document.getElementById('q').value.toLowerCase();
    const lvl = document.getElementById('lvl').value.replace('Level ', '');
    let out = rows.filter(r => (!lvl || r[f.level] === lvl) && (!q || cols.some(c => r[c].toLowerCase().includes(q))));
    const s = state.sort.roster || { col: f.last, dir: 'asc' };
    out.sort((a, b) => cmp(a[s.col], b[s.col]) * (s.dir === 'asc' ? 1 : -1));
    drawTable(document.getElementById('t'), cols, out, s, c => { toggleSort('roster', c, f.last); draw(); });
    document.getElementById('count').textContent = out.length + ' of ' + rows.length;
  };
  document.getElementById('q').oninput = draw;
  document.getElementById('lvl').onchange = draw;
  draw();
}

/* ---------- Calendar ---------- */
function renderCalendar(main) {
  const m = state.calMonth, today = new Date();
  const monthName = m.toLocaleString([], { month: 'long', year: 'numeric' });
  main.innerHTML = '<h1>Meet Calendar</h1>' +
    '<div class="cal-head"><h2>' + monthName + '</h2><button class="btn" id="prev">&lsaquo;</button><button class="btn" id="next">&rsaquo;</button><button class="btn" id="today">Today</button></div>' +
    '<div class="cal" id="cal"></div><div class="upcoming"><h2 style="margin-bottom:10px">Upcoming meets</h2><div class="panel" id="up"></div></div>';
  document.getElementById('prev').onclick = () => { state.calMonth = new Date(m.getFullYear(), m.getMonth() - 1, 1); render(); };
  document.getElementById('next').onclick = () => { state.calMonth = new Date(m.getFullYear(), m.getMonth() + 1, 1); render(); };
  document.getElementById('today').onclick = () => { state.calMonth = new Date(today.getFullYear(), today.getMonth(), 1); render(); };

  const cal = document.getElementById('cal');
  ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'].forEach(d => { const e = document.createElement('div'); e.className = 'dow'; e.textContent = d; cal.appendChild(e); });
  const first = new Date(m.getFullYear(), m.getMonth(), 1);
  const start = new Date(first); start.setDate(1 - first.getDay());
  for (let i = 0; i < 42; i++) {
    const d = new Date(start); d.setDate(start.getDate() + i);
    const cell = document.createElement('div');
    cell.className = 'day' + (d.getMonth() !== m.getMonth() ? ' other' : '') + (sameDay(d, today) ? ' today' : '');
    cell.innerHTML = '<span class="dnum">' + d.getDate() + '</span>';
    state.meets.filter(x => x.date && sameDay(x.date, d)).forEach(x => {
      const ev = document.createElement('div'); ev.className = 'ev'; ev.textContent = x.name; ev.title = x.name;
      ev.onclick = () => showMeet(x); cell.appendChild(ev);
    });
    cal.appendChild(cell);
  }

  const up = document.getElementById('up');
  const future = state.meets.filter(x => x.date && x.date >= new Date(today.getFullYear(), today.getMonth(), today.getDate())).sort((a, b) => a.date - b.date).slice(0, 12);
  if (!future.length) up.innerHTML = '<div class="empty">No upcoming meets</div>';
  future.forEach(x => {
    const r = document.createElement('div'); r.className = 'row';
    r.innerHTML = '<span class="date">' + x.date.toLocaleDateString([], { month: 'short', day: 'numeric' }) + '</span><span>' + esc(x.name) + (x.time ? ' <span style="color:var(--muted)">' + esc(x.time) + '</span>' : '') + '</span><span class="ath">' + esc(x.athletes || '') + '</span>';
    r.onclick = () => showMeet(x); up.appendChild(r);
  });
}
function showMeet(x) {
  const chips = (x.athletes || '').split(',').map(s => s.trim()).filter(Boolean).map(a => '<span>' + esc(a) + '</span>').join('');
  openModal('<h3>' + esc(x.name) + '</h3><div class="kv"><div class="k">Date</div><div>' + (x.date ? x.date.toLocaleDateString([], { weekday: 'long', month: 'long', day: 'numeric', year: 'numeric' }) : '') + '</div>' +
    '<div class="k">Time</div><div>' + esc(x.time || 'TBD') + '</div><div class="k">Athletes</div><div class="chips">' + (chips || '<span style="background:none;color:var(--muted)">None listed</span>') + '</div></div>');
}

/* ---------- This Season's Scores ---------- */
function renderSeason(main) {
  const f = CONFIG.fields.scores;
  const evKeys = Object.keys(f.events);
  const all = state.scores.filter(s => s.season === state.currentSeason);
  const athletes = [...new Set(all.map(s => s.name))].sort();
  const meets = [...new Set(all.map(s => s.meet).filter(Boolean))];

  main.innerHTML = '<h1>This Season\'s Scores</h1><div class="sub">' + state.currentSeason + ' season, ' + all.length + ' results</div>' +
    '<div class="controls"><select id="ath"><option value="">All athletes</option>' + athletes.map(a => '<option>' + esc(a) + '</option>').join('') + '</select>' +
    '<select id="meet"><option value="">All meets</option>' + meets.map(a => '<option>' + esc(a) + '</option>').join('') + '</select>' +
    '<select id="grp"><option value="meet">Group by meet</option><option value="name">Group by athlete</option><option value="">No grouping</option></select></div>' +
    '<div class="panel"><div class="scroll"><table id="t"></table></div></div>';

  const draw = () => {
    const ath = document.getElementById('ath').value, meet = document.getElementById('meet').value, grp = document.getElementById('grp').value;
    let rows = all.filter(s => (!ath || s.name === ath) && (!meet || s.meet === meet)).sort((a, b) => (b.date || 0) - (a.date || 0) || cmp(a.name, b.name));
    const t = document.getElementById('t');
    if (!rows.length) { t.innerHTML = '<tr><td class="empty">No scores yet this season. They will appear here after the first meet.</td></tr>'; return; }
    const head = ['Athlete', 'Date', 'Meet', 'Session', 'Level', 'Division', ...evKeys];
    let html = '<thead><tr>' + head.map((h, i) => '<th class="' + (i >= 6 ? 'num' : '') + '">' + esc(h) + '</th>').join('') + '</tr></thead><tbody>';
    let lastGroup = null;
    rows.forEach(s => {
      const g = grp === 'meet' ? s.meet : grp === 'name' ? s.name : null;
      if (grp && g !== lastGroup) { html += '<tr class="group"><td colspan="' + head.length + '">' + esc(g || 'Unknown') + '</td></tr>'; lastGroup = g; }
      html += '<tr><td>' + esc(s.name) + '</td><td>' + (s.date ? s.date.toLocaleDateString([], { month: 'short', day: 'numeric', year: 'numeric' }) : '') + '</td><td>' + esc(s.meet || '') + '</td><td>' + esc(s.session || '') + '</td><td>' + esc(s.level || '') + '</td><td>' + esc(s.division || '') + '</td>' +
        evKeys.map(e => '<td class="num">' + (s.ev[e] === null ? '' : s.ev[e].toFixed(3) + placeTag(s.pl[e])) + '</td>').join('') + '</tr>';
    });
    t.innerHTML = html + '</tbody>';
  };
  ['ath', 'meet', 'grp'].forEach(id => document.getElementById(id).onchange = draw);
  draw();
}
function placeTag(p) {
  if (!p) return '';
  const n = parseInt(p); const cls = n >= 1 && n <= 3 ? ' p' + n : '';
  return '<span class="place' + cls + '">' + esc(String(p).replace(/^(\d+)(st|nd|rd|th)?$/, (m, d) => ordinal(+d))) + '</span>';
}
function ordinal(n) { const s = ['th', 'st', 'nd', 'rd'], v = n % 100; return n + (s[(v - 20) % 10] || s[v] || s[0]); }

/* ---------- Best / Average ---------- */
function renderAgg(mode) {
  const f = CONFIG.fields.scores, evKeys = Object.keys(f.events);
  const isBest = mode === 'best';
  main_h = isBest ? 'Best Scores by Athlete' : 'Average Scores by Athlete';
  const main = document.getElementById('main');
  main.innerHTML = '<h1>' + main_h + '</h1><div class="tabs" id="tabs"></div><div class="grid" id="grid"></div>';

  const tabs = document.getElementById('tabs');
  [...state.seasons, 'All records'].forEach(s => {
    const b = document.createElement('button'); b.textContent = s; b.className = s === state.seasonTab ? 'active' : '';
    b.onclick = () => { state.seasonTab = s; renderAgg(mode); }; tabs.appendChild(b);
  });

  const rows = state.scores.filter(s => state.seasonTab === 'All records' || s.season === state.seasonTab);
  const grid = document.getElementById('grid');
  evKeys.forEach(e => {
    const by = {};
    rows.forEach(s => { if (s.ev[e] !== null) { (by[s.name] = by[s.name] || []).push(s.ev[e]); } });
    const list = Object.keys(by).map(n => ({ name: n, value: isBest ? Math.max(...by[n]) : by[n].reduce((a, b) => a + b, 0) / by[n].length, count: by[n].length }))
      .sort((a, b) => b.value - a.value);
    const card = document.createElement('div'); card.className = 'card';
    card.innerHTML = '<header><h2>' + (isBest ? 'Best ' : 'Average ') + esc(e) + '</h2><span class="count" style="padding:0">' + list.length + ' athletes</span></header>' +
      (list.length ? '<div class="scroll"><table><tbody>' + list.map((r, i) =>
        '<tr><td class="rank">' + (i + 1) + '</td><td>' + esc(r.name) + (isBest ? '' : ' <span class="place">' + r.count + ' meet' + (r.count === 1 ? '' : 's') + '</span>') + '</td><td class="num"><strong>' + r.value.toFixed(3) + '</strong></td></tr>').join('') +
        '</tbody></table></div>' : '<div class="empty">No scores for this season yet</div>');
    grid.appendChild(card);
  });
}
let main_h = '';

/* ---------- Chalk Fund ---------- */
function renderChalk(main) {
  const f = CONFIG.fields.chalk;
  const rows = state.data.chalk || [];
  main.innerHTML = '<h1>Chalk Fund Balance</h1>';
  if (!rows.length) { main.innerHTML += '<div class="empty">No chalk fund data</div>'; return; }
  rows.forEach(r => {
    const dep = num(r[f.deposit]), sp = num(r[f.spent]);
    const bal = r[f.balance] !== undefined && r[f.balance] !== '' ? r[f.balance] : (dep !== null && sp !== null ? dep - sp : '');
    main.innerHTML += (rows.length > 1 ? '<h2 style="margin:18px 0 10px">' + esc(r.Name || '') + '</h2>' : '') +
      '<div class="stats"><div class="stat"><div class="label">Deposited</div><div class="value">' + money(r[f.deposit]) + '</div></div>' +
      '<div class="stat"><div class="label">Spent</div><div class="value">' + money(r[f.spent]) + '</div></div>' +
      '<div class="stat balance"><div class="label">Balance</div><div class="value">' + money(bal) + '</div></div></div>';
  });
}

/* ---------- Helpers ---------- */
function drawTable(t, cols, rows, sort, onSort) {
  t.innerHTML = '<thead><tr>' + cols.map(c => '<th class="' + (sort.col === c ? 'sorted' : '') + '" data-c="' + esc(c) + '">' + esc(c) + (sort.col === c ? (sort.dir === 'asc' ? ' ▲' : ' ▼') : '') + '</th>').join('') + '</tr></thead><tbody>' +
    (rows.length ? rows.map(r => '<tr>' + cols.map(c => '<td>' + cellHtml(c, r[c]) + '</td>').join('') + '</tr>').join('') : '<tr><td colspan="' + cols.length + '" class="empty">No matches</td></tr>') + '</tbody>';
  t.querySelectorAll('th').forEach(th => th.onclick = () => onSort(th.dataset.c));
}
function cellHtml(col, v) {
  const s = String(v ?? '');
  if (!s) return '';
  if (/mail/i.test(col) && s.includes('@')) return '<a href="mailto:' + esc(s) + '" style="color:var(--purple-dark)">' + esc(s) + '</a>';
  if (/phone/i.test(col)) return '<a href="tel:' + esc(s.replace(/[^\d+]/g, '')) + '" style="color:var(--purple-dark)">' + esc(s) + '</a>';
  return esc(s);
}
function toggleSort(key, col, def) {
  const cur = state.sort[key] || { col: def, dir: 'asc' };
  state.sort[key] = { col, dir: cur.col === col && cur.dir === 'asc' ? 'desc' : 'asc' };
}
function cmp(a, b) { const x = num(a), y = num(b); if (x !== null && y !== null && String(a).trim() !== '' && String(b).trim() !== '') return x - y; return String(a ?? '').localeCompare(String(b ?? '')); }
function sameDay(a, b) { return a.getFullYear() === b.getFullYear() && a.getMonth() === b.getMonth() && a.getDate() === b.getDate(); }
function esc(v) { return String(v ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
function openModal(html) { document.getElementById('modal').innerHTML = '<button class="btn close" onclick="closeModal()">Close</button>' + html; document.getElementById('overlay').classList.add('open'); }
function closeModal() { document.getElementById('overlay').classList.remove('open'); }
document.getElementById('overlay').onclick = e => { if (e.target.id === 'overlay') closeModal(); };
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

const h = location.hash.replace('#', '');
if (SECTIONS.some(s => s[0] === h)) state.section = h;
init();
</script>
